name: astrbot_plugin_mail_notify
display_name: 邮件提醒
short_desc: 只读邮箱标题，按场景用 AI 筛选重要邮件并推送到 QQ，还能写入对话历史让机器人接着聊。
desc: 定时以只读方式检查邮箱（Gmail、QQ、163、126、Yahoo、iCloud、Fastmail、Zoho 或任意 IMAP），默认只读发件人和标题，交给 AI 判断是否属于你勾选的场景（DeepSeek、OpenAI、通义千问、GLM、Kimi、Gemini、Ollama，或 AstrBot 里已配置的模型），相关的通过 AstrBot 主动发送到 QQ 私聊，可选写入对话历史并用机器人的人设语气提醒。支持屏蔽验证码、白名单黑名单、免打扰时段、自测。
version: 0.4.5
author: qualcone
repo: https://github.com/qualcone/astrbot_plugin_mail_notify
astrbot_version: ">=4.16,<5"
